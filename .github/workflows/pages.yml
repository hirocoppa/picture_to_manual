name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Configure or initialize GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          # Initial site creation needs a PAT (Pages: write), or a GitHub App
          # token (Administration: write and Pages: write). GITHUB_TOKEN is
          # sufficient once the site exists, but cannot initialize a new site.
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
